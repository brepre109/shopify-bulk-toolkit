[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shopify-bulk-toolkit"
version = "0.1.0"
description = "Safe bulk catalog operations for Shopify (Admin GraphQL): export, dry-run diffs, resumable apply"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Brett Prejeant" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
shopify-bulk = "shopify_bulk.cli:main"

[tool.setuptools.packages.find]
include = ["shopify_bulk*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
